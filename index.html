<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWSTV - Remote HP Lengkap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #05140d; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

  <div class="max-w-md w-full bg-gray-900 border border-amber-500/30 rounded-2xl p-6 shadow-2xl">
    <div class="flex items-center gap-3 mb-6 pb-3 border-b border-gray-800">
      <i data-lucide="sliders" class="w-7 h-7 text-amber-400"></i>
      <div>
        <h1 class="text-xl font-bold text-amber-400">Remote JWSTV Lengkap</h1>
        <p class="text-xs text-gray-400">Pengaturan Sholat Jumat, Tarawih & Hari Raya</p>
      </div>
    </div>

    <!-- Mode Sakelar Khusus (Hari Raya & Tarawih) -->
    <div class="space-y-3 mb-6 bg-gray-800/80 p-4 rounded-xl border border-gray-700">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Mode Ibadah Khusus</h2>
      
      <div>
        <label class="block text-xs font-semibold text-emerald-300 mb-1">MODE SHOLAT HARI RAYA (IED)</label>
        <select id="select-eid" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white text-sm outline-none">
          <option value="off">Nonaktif (Mode Normal)</option>
          <option value="fitri">Idul Fitri</option>
          <option value="adha">Idul Adha</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-emerald-300 mb-1">JAM SHOLAT IED</label>
        <input type="time" id="input-eid-time" value="06:30" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white text-sm outline-none">
      </div>

      <div class="flex items-center justify-between pt-2">
        <span class="text-xs font-semibold text-emerald-300">MODE SHOLAT TARAWIH</span>
        <input type="checkbox" id="check-tarawih" class="w-5 h-5 accent-amber-500 rounded cursor-pointer">
      </div>
    </div>

    <form id="remote-form" onsubmit="saveSettings(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-emerald-400 mb-1">NAMA MASJID</label>
        <input type="text" id="input-name" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-emerald-400 mb-1">ALAMAT MASJID</label>
        <input type="text" id="input-address" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-emerald-400 mb-1">LATITUDE</label>
          <input type="text" id="input-lat" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-emerald-400 mb-1">LONGITUDE</label>
          <input type="text" id="input-lng" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-amber-400 mb-1">DURASI JEDA IQOMAH (MENIT)</label>
        <input type="number" id="input-iqomah" min="1" max="30" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-emerald-400 mb-1">RUNNING TEXT (INFORMASI)</label>
        <textarea id="input-text" rows="2" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white text-sm outline-none focus:border-amber-500"></textarea>
      </div>

      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold p-3.5 rounded-xl transition-all shadow-lg">
        Simpan & Update Layar TV
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-800 grid grid-cols-2 gap-3">
      <button onclick="toggleBlank()" class="bg-red-600/80 hover:bg-red-600 text-white p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
        <i data-lucide="power" class="w-4 h-4"></i> Standby Sholat
      </button>
      <button onclick="triggerBeep()" class="bg-blue-600/80 hover:bg-blue-600 text-white p-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
        <i data-lucide="volume-2" class="w-4 h-4"></i> Tes Bel TV
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // KONFIGURASI FIREBASE SAMAN DENGAN DI TV
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "jwstv-masjid.firebaseapp.com",
      databaseURL: "https://jwstv-masjid-default-rtdb.firebaseio.com",
      projectId: "jwstv-masjid",
      storageBucket: "jwstv-masjid.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123def456"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const configRef = db.ref("jwstv_settings");

    let currentIsBlank = false;

    configRef.on("value", (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('input-name').value = data.name || "";
        document.getElementById('input-address').value = data.address || "";
        document.getElementById('input-lat').value = data.lat || "-6.2088";
        document.getElementById('input-lng').value = data.lng || "106.8456";
        document.getElementById('input-iqomah').value = data.iqomahMinutes || 10;
        document.getElementById('input-text').value = data.runningText || "";
        
        document.getElementById('select-eid').value = data.modeEid || "off";
        document.getElementById('input-eid-time').value = data.eidTime || "06:30";
        document.getElementById('check-tarawih').checked = !!data.modeTarawih;

        currentIsBlank = !!data.isBlank;
      }
    });

    function saveSettings(e) {
      e.preventDefault();
      configRef.update({
        name: document.getElementById('input-name').value,
        address: document.getElementById('input-address').value,
        lat: document.getElementById('input-lat').value,
        lng: document.getElementById('input-lng').value,
        iqomahMinutes: document.getElementById('input-iqomah').value,
        runningText: document.getElementById('input-text').value,
        modeEid: document.getElementById('select-eid').value,
        eidTime: document.getElementById('input-eid-time').value,
        modeTarawih: document.getElementById('check-tarawih').checked
      }).then(() => alert("Pengaturan berhasil diperbarui di Layar TV!"));
    }

    function toggleBlank() {
      configRef.update({ isBlank: !currentIsBlank });
    }

    function triggerBeep() {
      configRef.update({ triggerBeep: true });
    }
  </script>
</body>
</html>
